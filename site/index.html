<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>票拼拼 - 电子发票拼版打印助手</title>
<meta name="description" content="发票拼一拼，A4 打印更省纸。电子发票自动拼版打印工具，支持 PDF/OFD/XML/图片，文件不出浏览器，免费免安装。">
<script src="vendor/tailwind.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/Sortable.min.js"></script>
<script src="ads-config.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: {
    50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'} } } } };
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js';
</script>
<link rel="stylesheet" href="core/print.css">
<style>
  body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#f8fafc; }
  .a4-page { background:#fff; box-shadow:0 10px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1); position:relative; box-sizing:border-box; }
  /* .slot-cut 已废弃：裁切线改为 cutLines() 生成的全页分割线 */
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#f1f5f9}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

<header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-brand-600 text-white p-2 rounded-lg flex items-center justify-center w-10 h-10 shadow-sm text-lg font-bold">拼</div>
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">票拼拼</h1>
        <p class="text-xs text-slate-500">发票拼一拼，A4 打印更省纸。</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button id="btn-clear" class="px-3 py-1.5 text-xs font-semibold text-white bg-rose-500 hover:bg-rose-600 rounded-md shadow-sm transition-colors">清空</button>
      <button id="btn-print" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm transition-all">立即打印 (A4)</button>
    </div>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 no-print">

  <div class="lg:col-span-5 flex flex-col gap-6">
    <!-- 上传 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h2 class="text-base font-bold text-slate-900 mb-3">上传电子发票</h2>
      <div id="dropzone" class="border-2 border-dashed border-slate-300 hover:border-brand-500 bg-slate-50/50 hover:bg-brand-50/30 rounded-xl p-6 text-center cursor-pointer transition-all">
        <input type="file" id="file-input" multiple accept=".pdf,.ofd,.xml,.png,.jpg,.jpeg,image/png,image/jpeg" class="hidden">
        <p class="text-sm font-medium text-slate-700">点击上传 或 将发票文件拖拽至此处</p>
        <p class="text-xs text-slate-400 mt-1">支持 PDF、OFD、XML、PNG、JPG · 单文件 ≤20MB · 文件只在你的浏览器里处理</p>
      </div>
      <div class="mt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">已添加发票 (<span id="invoice-count">0</span>)</span>
          <span class="text-xs text-slate-400">拖拽调整打印顺序</span>
        </div>
        <div id="invoice-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
      </div>
    </div>

    <!-- 拼版设置 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <h2 class="text-base font-bold text-slate-900 mb-4">拼版排版设置</h2>
      <div class="space-y-4 text-sm">
        <div>
          <label class="block font-medium text-slate-700 mb-2">每页发票拼版张数</label>
          <div class="grid grid-cols-4 gap-2" id="layout-btns"></div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">纸张页边距 (mm)</label>
            <input type="range" id="margin-input" min="5" max="25" value="10" class="w-full accent-brand-600">
            <div class="flex justify-between text-xs text-slate-400"><span>5mm</span><span id="margin-val" class="font-bold text-slate-700">10mm</span><span>25mm</span></div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">发票卡片间距 (mm)</label>
            <input type="range" id="gap-input" min="2" max="20" value="8" class="w-full accent-brand-600">
            <div class="flex justify-between text-xs text-slate-400"><span>2mm</span><span id="gap-val" class="font-bold text-slate-700">8mm</span><span>20mm</span></div>
          </div>
        </div>
        <div class="pt-2 border-t border-slate-100">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-xs font-medium text-slate-700">显示剪切虚线 (便于裁剪贴票)</span>
            <input type="checkbox" id="show-cutlines" checked class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500">
          </label>
        </div>
      </div>
    </div>

    <!-- 广告位（C8/C9，docs/03） -->
    <div id="ad-slot" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4 min-h-[120px]"></div>
  </div>

  <!-- 预览 -->
  <div class="lg:col-span-7 flex flex-col">
    <div class="bg-white rounded-t-xl border border-slate-200 p-4 flex items-center justify-between border-b-0">
      <div class="flex items-center space-x-2">
        <span class="text-sm font-bold text-slate-800">A4 纸张实时打印预览</span>
        <span id="page-count-badge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">第 1 / 1 页</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-prev" class="p-1.5 text-slate-500 hover:text-brand-600 hover:bg-slate-100 rounded disabled:opacity-30">‹ 上一页</button>
        <span id="page-indicator" class="text-xs font-medium text-slate-600">1 / 1</span>
        <button id="btn-next" class="p-1.5 text-slate-500 hover:text-brand-600 hover:bg-slate-100 rounded disabled:opacity-30">下一页 ›</button>
      </div>
    </div>
    <div class="bg-slate-200/70 border border-slate-200 rounded-b-xl p-6 min-h-[880px] flex items-start justify-center overflow-auto">
      <div id="a4-canvas" class="a4-page"></div>
    </div>
  </div>
</main>

<footer class="no-print border-t border-slate-200 bg-white py-4">
  <div class="max-w-7xl mx-auto px-4 text-xs text-slate-400 flex flex-wrap items-center justify-between gap-2">
    <span>© 票拼拼 piaopinpin · 发票文件不离开你的电脑</span>
    <nav class="flex items-center gap-3">
      <a href="https://www.daogong.cc" target="_blank" rel="noopener" class="text-brand-600 hover:text-brand-700 font-medium">返回主站 →</a>
      <span class="text-slate-300">|</span>
      <a href="/privacy.html" class="hover:text-brand-600">隐私政策</a>
      <a href="/about.html" class="hover:text-brand-600">关于我们</a>
      <a href="/terms.html" class="hover:text-brand-600">使用条款</a>
      <a href="/contact.html" class="hover:text-brand-600">联系我们</a>
    </nav>
  </div>
</footer>

<!-- 打印目标：由 JS 按 layout.js 结果生成全部 A4 页 -->
<div id="print-area" class="hidden-print-root"></div>

<script type="module" src="ui/app.js"></script>
</body>
</html>
